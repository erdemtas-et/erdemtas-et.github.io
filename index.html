<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Erdem Tas mobil uygulamaları geliştirici sayfası.">
  <title>KPSS Sözel • Geliştirici</title>
  <style>
    :root { color-scheme: light dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f1f2f6; color: #17181d; }
    main { width: min(560px, calc(100% - 40px)); padding: 42px; border-radius: 28px; background: rgba(255,255,255,.82); box-shadow: 0 24px 70px rgba(24,31,58,.12); }
    .mark { width: 58px; height: 58px; display: grid; place-items: center; border-radius: 17px; color: white; background: linear-gradient(145deg,#8290ff,#5368ec); font-size: 28px; font-weight: 800; }
    h1 { margin: 24px 0 12px; font-size: 38px; letter-spacing: -.04em; }
    p { color: #656a78; line-height: 1.6; }
    nav { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 28px; }
    a { padding: 12px 16px; border-radius: 12px; background: #5368ec; color: white; text-decoration: none; font-weight: 700; }
    a.secondary { background: rgba(83,104,236,.12); color: #5368ec; }
    @media (prefers-color-scheme: dark) { body { background:#111216; color:#f5f6f8; } main { background:#1d1f26; } p { color:#a8adbb; } a.secondary { color:#95a1ff; } }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">✓</div>
    <h1>KPSS Sözel</h1>
    <p>Türkçe, sözel mantık ve genel kültür alanlarında sınav hazırlığı için geliştirilen iOS uygulaması.</p>
    <nav>
      <a href="https://erdemtas-et.github.io/kpss-sozel-support/">Destek</a>
      <a class="secondary" href="https://erdemtas-et.github.io/kpss-sozel-support/privacy.html">Gizlilik Politikası</a>
    </nav>
  </main>
</body>
</html>
